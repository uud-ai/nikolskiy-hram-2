    <title>Клирос — богослужебный помощник</title>
    <script type="module" crossorigin src="/kliros/assets/index-D-J2Gejb.js"></script>
    <link rel="stylesheet" crossorigin href="/kliros/assets/index-CIEvVp-1.css">
  <link rel="manifest" href="/kliros/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/kliros/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
    <!-- Возврат на главную сайта храма, если сюда попали переходом оттуда
         (document.referrer, без хардкода домена — не ломается при прямом
         заходе/PWA-установке). Вставлен ДО того, как React смонтируется в
         #root (этот inline-скрипт — классический, выполняется сразу при
         парсинге, а бандл приложения — type="module", он всегда
         откладывается до конца парсинга документа), поэтому React об этом
         узле ничего не знает и не трогает его при любых ре-рендерах.
         См. аналогичную кнопку в Благовесте (gospel-navigator/index.html). -->
    <script>
      (function () {
        var ref;
        try { ref = new URL(document.referrer); } catch (e) { return; }
        if (ref.origin !== location.origin || ref.href === location.href) return;
        var bar = document.createElement("a");
        bar.href = ref.href;
        bar.textContent = "‹ Назад на сайт";
        bar.style.cssText = "display:block;padding:10px 20px;" +
          "font:500 0.95rem var(--font-ui,Bitter,system-ui,sans-serif);" +
          "color:var(--red,#9c1c1c);background:var(--bg-panel,#fbf7ec);" +
          "border-bottom:1px solid var(--rule,#d9cfb8);text-decoration:none;";
        document.body.insertBefore(bar, document.body.firstChild);
      })();
    </script>
  </body>
