name: diag-blagovest
on:
  push:
    branches: [diag/blagovest-check]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe chat worker
        run: |
          true
          for origin in https://nikolskiyhram.site https://uud-ai.github.io; do
            curl -sS -m 60 -o body.txt -w "HTTP %{http_code} in %{time_total}s"  \
              -X POST https://blagovest-chat.uudnik.workers.dev/ \
              -H 'Content-Type: application/json' \
              -H 'X-App-Token: bg-public-v1-7Kp9qLm3X' \
              -H "Origin: $origin" \
              --data '{"messages":[{"role":"user","content":"Что такое любовь по Евангелию?"}],"topicContext":null,"source":"free_chat","topicId":null}' > meta.txt || true
            echo "::notice title=$origin::$(cat meta.txt) BODY=$(head -c 900 body.txt | tr '\n\r' '  ')"
          done
          echo "::notice title=proxyapi::$(curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}' https://api.proxyapi.ru/openai/v1/models)"
          echo "::notice title=rawdata::$(curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}' -I https://raw.githubusercontent.com/uud-ai/gospel-navigator/main/data/bible.json)"
